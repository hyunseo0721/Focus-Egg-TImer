<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Egg Timer</title>
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    
    <!-- React & DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { 
            margin: 0; background-color: #1f1f1f; color: white; overflow: hidden; user-select: none; 
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        .egg-shape { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; overflow: hidden; position: relative; touch-action: none; }
        .fill-transition { transition: height 0.05s linear; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const themeColors = [
            { id: 'blue', value: '#3b82f6' }, { id: 'red', value: '#ef4444' }, { id: 'pink', value: '#ec4899' },
            { id: 'yellow', value: '#eab308' }, { id: 'green', value: '#22c55e' }, { id: 'purple', value: '#a855f7' },
            { id: 'white', value: '#ffffff' }, { id: 'black', value: '#2a2a2a' } 
        ];

        const i18n = {
            KO: { 
                lang: "언어", color: "색상", start: "집중 시작하기", pause: "일시정지", reset: "초기화", complete: "완료", stopAlarm: "알람 끄기", clock: "시계", timer: "에그 타이머", sw: "스톱워치", calendar: "달력", stats: "통계", group: "그룹",
                locale: "ko-KR", am: "오전", pm: "오후", noRecords: "기록이 없습니다.", h: "시간", m: "분", s: "초", totalPrefix: "총 ",
                formatYear: (y) => `${y}년`, formatYearMonth: (y, m) => `${y}년 ${m}`, formatMonthDay: (m, d) => `${m} ${d}일`,
                statsSummary: "통계 요약", today: "오늘", thisWeek: "이번 주", thisMonth: "이번 달", thisYear: "올해", allTime: "전체",
                attendance: "출석", attend: "출석하기", attended: "출석 완료!",
                curAttendStreak: "현재 연속 출석", maxAttendStreak: "최장 연속 출석",
                curFocusStreak: "현재 연속 집중", maxFocusStreak: "최장 연속 집중", days: "일",
                focusCompletedToday: " 오늘 집중 완료! ",
                noFocusToday: "오늘 아직 집중 기록 없음",
                addGroup: "새 그룹 추가", editGroup: "그룹 이름 수정", groupName: "그룹 이름", save: "저장", cancel: "취소", maxGroupsMsg: "최대 10개의 그룹만 만들 수 있습니다.", selectGroup: "어느 그룹에 방금 전 타이머를 추가하시겠습니까?", skip: "건너뛰기", noGroups: "생성된 그룹이 없습니다.", sessions: "개의 기록",
                deleteConfirm: "이 그룹을 정말 삭제하시겠습니까? (관련 기록은 보존됩니다)"
            },
            EN: { 
                lang: "Lang", color: "Color", start: "Start Focus", pause: "Pause", reset: "Reset", complete: "Complete", stopAlarm: "Stop", clock: "Clock", timer: "Egg Timer", sw: "Stopwatch", calendar: "Calendar", stats: "Stats", group: "Group",
                locale: "en-US", am: "AM", pm: "PM", noRecords: "No records found.", h: "h", m: "m", s: "s", totalPrefix: "Total ",
                formatYear: (y) => `${y}`, formatYearMonth: (y, m) => `${m} ${y}`, formatMonthDay: (m, d) => `${m} ${d}`,
                statsSummary: "Stats Summary", today: "Today", thisWeek: "This Week", thisMonth: "This Month", thisYear: "This Year", allTime: "All Time",
                attendance: "Attendance", attend: "Check In", attended: "Checked In!",
                curAttendStreak: "Current Streak", maxAttendStreak: "Best Streak",
                curFocusStreak: "Current Streak", maxFocusStreak: "Best Streak", days: "days",
                focusCompletedToday: " Focus Completed! ",
                noFocusToday: "No focus records today",
                addGroup: "Add New Group", editGroup: "Rename Group", groupName: "Group Name", save: "Save", cancel: "Cancel", maxGroupsMsg: "You can only create up to 10 groups.", selectGroup: "Add recent timer to which group?", skip: "Skip", noGroups: "No groups found.", sessions: "sessions",
                deleteConfirm: "Are you sure you want to delete this group? (Records will be kept)"
            },
            ES: { 
                lang: "Idioma", color: "Color", start: "Iniciar Enfoque", pause: "Pausa", reset: "Restablecer", complete: "Completar", stopAlarm: "Detener", clock: "Reloj", timer: "Temporizador Huevo", sw: "Cronómetro", calendar: "Calendario", stats: "Estadísticas", group: "Grupo",
                locale: "es-ES", am: "AM", pm: "PM", noRecords: "No hay registros.", h: "h", m: "m", s: "s", totalPrefix: "Total ",
                formatYear: (y) => `${y}`, formatYearMonth: (y, m) => `${m} de ${y}`, formatMonthDay: (m, d) => `${d} de ${m}`,
                statsSummary: "Resumen", today: "Hoy", thisWeek: "Esta Semana", thisMonth: "Este Mes", thisYear: "Este Año", allTime: "Todo",
                attendance: "Asistencia", attend: "Asistir", attended: "¡Asistido!",
                curAttendStreak: "Racha Actual", maxAttendStreak: "Mejor Racha",
                curFocusStreak: "Racha Actual", maxFocusStreak: "Mejor Racha", days: "días",
                focusCompletedToday: " ¡Enfoque completado! ",
                noFocusToday: "Sin registros hoy",
                addGroup: "Añadir Nuevo Grupo", editGroup: "Renombrar Grupo", groupName: "Nombre del Grupo", save: "Guardar", cancel: "Cancelar", maxGroupsMsg: "Solo puedes crear hasta 10 grupos.", selectGroup: "¿A qué grupo añadir el temporizador reciente?", skip: "Saltar", noGroups: "No hay grupos.", sessions: "sesiones",
                deleteConfirm: "¿Estás seguro de que deseas eliminar este grupo? (Los registros se mantendrán)"
            }
        };

        function App() {
            const [lang, setLang] = useState('KO');
            const [mode, setMode] = useState('timer'); 
            const [selectedColor, setSelectedColor] = useState('#3b82f6'); 
            const [now, setNow] = useState(new Date());
            
            // --- 달력 상태 ---
            const [calYear, setCalYear] = useState(new Date().getFullYear());
            const [calMonth, setCalMonth] = useState(new Date().getMonth()); 

            // --- 출석 상태 ---
            const [attendance, setAttendance] = useState(() => {
                try {
                    const saved = localStorage.getItem('focus_egg_attendance_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            useEffect(() => {
                try { localStorage.setItem('focus_egg_attendance_v2', JSON.stringify(attendance)); } 
                catch (e) {}
            }, [attendance]);

            // --- 그룹(재생목록) 상태 ---
            const [groups, setGroups] = useState(() => {
                try {
                    const saved = localStorage.getItem('focus_egg_groups_v1');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            useEffect(() => {
                try { localStorage.setItem('focus_egg_groups_v1', JSON.stringify(groups)); } 
                catch (e) {}
            }, [groups]);

            const [groupModal, setGroupModal] = useState({ isOpen: false, mode: 'add', id: null });
            const [newGroupName, setNewGroupName] = useState("");
            const [activeGroupId, setActiveGroupId] = useState(null);
            const [showGroupSelectModal, setShowGroupSelectModal] = useState(false);
            const latestSessionRef = useRef(null);

            // --- 통계 및 기록 상태 ---
            const [sessions, setSessions] = useState(() => {
                try {
                    const saved = localStorage.getItem('focus_egg_sessions_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            useEffect(() => {
                try { localStorage.setItem('focus_egg_sessions_v2', JSON.stringify(sessions)); } 
                catch (e) {}
            }, [sessions]);
            
            // --- 에그 타이머 상태 ---
            const [eggIsRunning, setEggIsRunning] = useState(false);
            const [eggIsAlarming, setEggIsAlarming] = useState(false);
            const [eggDuration, setEggDuration] = useState(1800000); 
            const [eggElapsed, setEggElapsed] = useState(0); 
            
            // --- 스톱워치 상태 ---
            const [swIsRunning, setSwIsRunning] = useState(false);
            const [swElapsed, setSwElapsed] = useState(0);
            
            const [isDragging, setIsDragging] = useState(false);
            const eggRef = useRef(null);

            const eggStartRef = useRef(0);
            const eggAccRef = useRef(0);
            const eggDurationRef = useRef(1800000);
            const eggIsRunningRef = useRef(false);

            const swStartRef = useRef(0);
            const swAccRef = useRef(0);
            const swIsRunningRef = useRef(false);

            const requestRef = useRef(null);
            const audioRef = useRef(null);
            const t = i18n[lang];

            useEffect(() => { eggIsRunningRef.current = eggIsRunning; }, [eggIsRunning]);
            useEffect(() => { eggDurationRef.current = eggDuration; }, [eggDuration]);
            useEffect(() => { swIsRunningRef.current = swIsRunning; }, [swIsRunning]);

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio('soundeffect/alarm.wav');
                    audioRef.current.loop = true;
                    audioRef.current.volume = 1.0; 
                }
            }, []);

            useEffect(() => {
                const workerCode = `
                    let timer;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            timer = setInterval(() => self.postMessage('tick'), 1000);
                        } else if (e.data === 'stop') {
                            clearInterval(timer);
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));

                worker.onmessage = () => {
                    setNow(new Date());
                    
                    if (eggIsRunningRef.current) {
                        const elapsed = eggAccRef.current + (Date.now() - eggStartRef.current);
                        if (elapsed >= eggDurationRef.current) {
                            setEggElapsed(eggDurationRef.current);
                            setEggIsRunning(false);
                            eggIsRunningRef.current = false;
                            setEggIsAlarming(true);
                            if (audioRef.current) {
                                audioRef.current.play().catch(err => console.log("Audio Error:", err));
                            }
                            
                            const endTime = Date.now();
                            latestSessionRef.current = endTime; 
                            
                            setSessions(prev => {
                                const newSession = { timestamp: endTime, duration: eggDurationRef.current, groupId: null, type: 'timer' };
                                const updated = [newSession, ...prev];
                                try {
                                    localStorage.setItem('focus_egg_sessions_v2', JSON.stringify(updated));
                                } catch (e) {}
                                return updated;
                            });
                        }
                    }
                };

                worker.postMessage('start');
                return () => { worker.postMessage('stop'); worker.terminate(); };
            }, []);

            useEffect(() => {
                const updateUI = () => {
                    const currentTime = Date.now();
                    if (eggIsRunningRef.current) {
                        const elapsed = eggAccRef.current + (currentTime - eggStartRef.current);
                        if (elapsed < eggDurationRef.current) setEggElapsed(elapsed);
                    }
                    if (swIsRunningRef.current) {
                        setSwElapsed(swAccRef.current + (currentTime - swStartRef.current));
                    }
                    requestRef.current = requestAnimationFrame(updateUI);
                };
                requestRef.current = requestAnimationFrame(updateUI);
                return () => cancelAnimationFrame(requestRef.current);
            }, []);

            const getStreak = (datesArray) => {
                if (!datesArray || datesArray.length === 0) return { current: 0, max: 0 };
                const uniqueDates = [...new Set(datesArray.map(d => new Date(d).toDateString()))]
                    .map(dStr => new Date(dStr))
                    .sort((a, b) => b - a);

                if (uniqueDates.length === 0) return { current: 0, max: 0 };

                let maxStreak = 1;
                let tempStreak = 1;

                const today = new Date();
                today.setHours(0,0,0,0);
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);

                for (let i = 0; i < uniqueDates.length - 1; i++) {
                    const diffTime = uniqueDates[i] - uniqueDates[i+1];
                    const diffDays = Math.round(diffTime / 86400000);
                    if (diffDays === 1) {
                        tempStreak++;
                        if (tempStreak > maxStreak) maxStreak = tempStreak;
                    } else {
                        tempStreak = 1;
                    }
                }

                let currentStreak = 0;
                const firstDate = uniqueDates[0];
                if (firstDate.getTime() === today.getTime() || firstDate.getTime() === yesterday.getTime()) {
                    let curr = 1;
                    for (let i = 0; i < uniqueDates.length - 1; i++) {
                        const diffTime = uniqueDates[i] - uniqueDates[i+1];
                        const diffDays = Math.round(diffTime / 86400000);
                        if (diffDays === 1) curr++;
                        else break;
                    }
                    currentStreak = curr;
                }

                return { current: currentStreak, max: maxStreak };
            };

            const getSummary = () => {
                const now = new Date();
                const todayStr = now.toDateString();
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - now.getDay());
                startOfWeek.setHours(0,0,0,0);
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                const startOfYear = new Date(now.getFullYear(), 0, 1);

                let todaySum = 0, weekSum = 0, monthSum = 0, yearSum = 0, totalSum = 0;
                sessions.forEach(s => {
                    const d = new Date(s.timestamp);
                    totalSum += s.duration;
                    if (d.toDateString() === todayStr) todaySum += s.duration;
                    if (d >= startOfWeek) weekSum += s.duration;
                    if (d >= startOfMonth) monthSum += s.duration;
                    if (d >= startOfYear) yearSum += s.duration;
                });
                return { todaySum, weekSum, monthSum, yearSum, totalSum };
            };

            const summary = getSummary();
            const handleAttend = () => {
                const todayStr = new Date().toDateString();
                if (!attendance.some(d => new Date(d).toDateString() === todayStr)) {
                    setAttendance(prev => [...prev, Date.now()]);
                }
            };
            const hasAttendedToday = attendance.some(d => new Date(d).toDateString() === new Date().toDateString());
            const attendStreak = getStreak(attendance);
            const focusDates = sessions.map(s => s.timestamp);
            const focusStreak = getStreak(focusDates);
            const hasFocusedToday = sessions.some(s => new Date(s.timestamp).toDateString() === new Date().toDateString());

            const toggleEggRun = () => {
                if (eggDuration === 0) return;
                if (!eggIsRunning) eggStartRef.current = Date.now();
                else eggAccRef.current = eggElapsed;
                setEggIsRunning(!eggIsRunning);
            };

            const handleEggReset = () => {
                setEggIsRunning(false); setEggIsAlarming(false); setEggElapsed(0); eggAccRef.current = 0;
                if (audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; }
            };

            const toggleSwRun = () => {
                if (!swIsRunning) swStartRef.current = Date.now();
                else swAccRef.current = swElapsed;
                setSwIsRunning(!swIsRunning);
            };

            const handleSwReset = () => { 
                setSwIsRunning(false); setSwElapsed(0); swAccRef.current = 0; 
            };

            const handleSwComplete = () => {
                const endTime = Date.now();
                latestSessionRef.current = endTime;
                setSessions(prev => {
                    const newSession = { timestamp: endTime, duration: swElapsed, groupId: null, type: 'stopwatch' };
                    const updated = [newSession, ...prev];
                    try { localStorage.setItem('focus_egg_sessions_v2', JSON.stringify(updated)); } catch (e) {}
                    return updated;
                });
                setSwIsRunning(false); setSwElapsed(0); swAccRef.current = 0;
                if (groups.length > 0) setShowGroupSelectModal(true);
            };

            const handlePointerDown = (e) => { if (eggIsRunning) return; setIsDragging(true); e.target.setPointerCapture(e.pointerId); updateTimeFromPointer(e); };
            const handlePointerMove = (e) => { if (!isDragging || eggIsRunning) return; updateTimeFromPointer(e); };
            const handlePointerUp = (e) => { setIsDragging(false); e.target.releasePointerCapture(e.pointerId); };
            const updateTimeFromPointer = (e) => {
                if (!eggRef.current) return;
                const rect = eggRef.current.getBoundingClientRect();
                let y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
                let percent = 1 - (y / rect.height);
                let totalSeconds = Math.round((percent * 3600) / 10) * 10;
                setEggDuration(totalSeconds * 1000);
                setEggElapsed(0); eggAccRef.current = 0;
            };

            const getEggDisplayTime = () => {
                const msToDisplay = Math.max(0, eggDuration - eggElapsed);
                const m = Math.floor(msToDisplay / 60000), s = Math.floor((msToDisplay % 60000) / 1000);
                return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            };

            const getSwDisplayTime = () => {
                const totalSec = Math.floor(swElapsed / 1000);
                const m = Math.floor(totalSec / 60), s = totalSec % 60, ms = swElapsed % 1000;
                return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
            };

            const getFillPercentage = () => (eggDuration === 0) ? 0 : (Math.max(0, eggDuration - eggElapsed) / 3600000) * 100;

            const formatTime = (timestamp) => {
                const d = new Date(timestamp);
                const hours = d.getHours();
                const ampm = hours >= 12 ? t.pm : t.am;
                const h12 = hours % 12 || 12;
                const m = String(d.getMinutes()).padStart(2, '0');
                return `${ampm} ${h12}:${m}`;
            };

            const formatDuration = (ms) => {
                if (!ms) return `0${t.s}`;
                const totalSecs = Math.floor(ms / 1000);
                const h = Math.floor(totalSecs / 3600);
                const m = Math.floor((totalSecs % 3600) / 60);
                const s = totalSecs % 60;
                
                let res = [];
                if (h > 0) res.push(`${h}${t.h}`);
                if (m > 0) res.push(`${m}${t.m}`);
                if (s > 0) res.push(`${s}${t.s}`);
                return res.length > 0 ? res.join(' ') : `0${t.s}`;
            };

            const formatDetailedTotal = (ms) => {
                const totalSecs = Math.floor(ms / 1000);
                const h = String(Math.floor(totalSecs / 3600)).padStart(2, '0');
                const m = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
                const s = String(totalSecs % 60).padStart(2, '0');
                
                if (lang === 'KO') return `총 ${h}시간 ${m}분 ${s}초`;
                return `Total ${h}h ${m}m ${s}s`; 
            };

            const assignGroupToSession = (groupId) => {
                setSessions(prev => {
                    const updated = prev.map(s => s.timestamp === latestSessionRef.current ? { ...s, groupId } : s);
                    try { localStorage.setItem('focus_egg_sessions_v2', JSON.stringify(updated)); } catch (e) {}
                    return updated;
                });
                setShowGroupSelectModal(false);
            };

            const handleDeleteGroup = (groupId) => {
                if(window.confirm(t.deleteConfirm)) {
                    setGroups(groups.filter(g => g.id !== groupId));
                    setSessions(sessions.map(s => s.groupId === groupId ? { ...s, groupId: null } : s));
                    setActiveGroupId(null);
                }
            };

            const renderClock = () => {
                const hours = now.getHours();
                const ampm = hours >= 12 ? t.pm : t.am;
                const h12 = hours % 12 || 12;
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                const dateStr = now.toLocaleDateString(t.locale, { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

                return (
                    <motion.div initial={{ opacity: 0, scale: 1 }} animate={{ opacity: 1, scale: 1 }} className="flex flex-col items-center justify-center w-full h-full pb-10 px-4 text-center">
                        <div className="text-neutral-400 text-lg sm:text-3xl font-medium tracking-widest mb-2 sm:mb-10">{t.clock}</div>
                        <div className="flex flex-row items-baseline gap-2 sm:gap-6 text-white mb-4">
                            <span className="text-xl sm:text-4xl text-neutral-400 font-medium">{ampm}</span>
                            <span className="text-5xl sm:text-[10rem] font-mono tracking-tighter leading-none">{String(h12).padStart(2,'0')}:{m}:{s}</span>
                        </div>
                        <div className="text-neutral-500 text-sm sm:text-2xl">{dateStr}</div>
                    </motion.div>
                );
            };

            const renderCalendar = () => {
                const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
                const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
                const prevTotalDays = new Date(calYear, calMonth, 0).getDate();

                const days = [];
                const weekdays = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(2021, 5, 6 + i); 
                    weekdays.push(d.toLocaleDateString(t.locale, { weekday: 'short' }));
                }

                for (let i = firstDayIndex - 1; i >= 0; i--) days.push({ day: prevTotalDays - i, currentMonth: false });
                for (let i = 1; i <= totalDays; i++) days.push({ day: i, currentMonth: true });
                const remainingCells = 42 - days.length;
                for (let i = 1; i <= remainingCells; i++) days.push({ day: i, currentMonth: false });

                const today = new Date();
                const isCurrentMonthYear = today.getFullYear() === calYear && today.getMonth() === calMonth;
                const todayDate = today.getDate();

                const months = Array.from({ length: 12 }, (_, i) => {
                    return new Date(2026, i, 1).toLocaleDateString(t.locale, { month: 'long' });
                });

                const prevMonth = () => { if (calMonth === 0) { setCalYear(calYear - 1); setCalMonth(11); } else { setCalMonth(calMonth - 1); } };
                const nextMonth = () => { if (calMonth === 11) { setCalYear(calYear + 1); setCalMonth(0); } else { setCalMonth(calMonth + 1); } };

                return (
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.3 }} className="w-full h-full flex items-center justify-center pb-10 px-4">
                        <div className="flex flex-row gap-6 items-center justify-center w-full max-w-5xl">
                            <div className="w-full max-w-[550px] shrink-0 bg-[#141414] p-4 sm:p-12 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl border border-neutral-800/50">
                                <div className="flex justify-between items-center mb-3 sm:mb-10 px-2">
                                    <button onClick={prevMonth} className="text-xl sm:text-3xl text-neutral-500 hover:text-white transition-colors p-2">&larr;</button>
                                    <div className="text-lg sm:text-4xl font-medium tracking-wide text-white">
                                        {lang === 'KO' ? (
                                            <>{calYear}년 <span className="font-light text-neutral-400 ml-1">{months[calMonth]}</span></>
                                        ) : lang === 'EN' ? (
                                            <>{months[calMonth]} <span className="font-light text-neutral-400 ml-1">{calYear}</span></>
                                        ) : (
                                            <>{months[calMonth]} <span className="font-light text-neutral-400 ml-1">de {calYear}</span></>
                                        )}
                                    </div>
                                    <button onClick={nextMonth} className="text-xl sm:text-3xl text-neutral-500 hover:text-white transition-colors p-2">&rarr;</button>
                                </div>
                                <div className="grid grid-cols-7 mb-2 sm:mb-6">
                                    {weekdays.map((w, idx) => (
                                        <div key={idx} className={`text-center text-[10px] sm:text-sm font-semibold tracking-widest uppercase ${idx === 0 ? 'text-red-400/50' : idx === 6 ? 'text-blue-400/50' : 'text-neutral-500'}`}>
                                            {w}
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-7 gap-y-1 sm:gap-y-4 gap-x-1 sm:gap-x-2">
                                    {days.map((item, idx) => {
                                        const isToday = isCurrentMonthYear && item.currentMonth && item.day === todayDate;
                                        return (
                                            <div key={idx} className="flex justify-center items-center relative">
                                                <div className={`w-7 h-7 sm:w-12 sm:h-12 flex items-center justify-center rounded-full transition-all duration-200 ${!item.currentMonth ? 'text-neutral-700 font-light text-xs sm:text-xl' : isToday ? 'bg-white text-black font-bold text-sm sm:text-2xl scale-125 shadow-md z-10' : 'text-neutral-200 hover:bg-[#2a2a2a] cursor-pointer text-xs sm:text-xl'}`}>
                                                    {item.day}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="w-[300px] shrink-0 bg-[#141414] h-[550px] p-8 rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col items-center justify-between">
                                <div className="text-2xl font-bold text-white mb-6 w-full text-center">{t.attendance}</div>
                                {hasAttendedToday ? (
                                    <button className="px-8 py-4 rounded-full font-bold text-lg border-2 transition-all duration-300 bg-transparent border-neutral-500 text-neutral-300 cursor-default w-full max-w-[220px]">
                                        {t.attended}
                                    </button>
                                ) : (
                                    <button onClick={handleAttend} className="px-8 py-4 rounded-full font-bold text-lg border-2 transition-all duration-300 bg-transparent border-white text-white hover:bg-white hover:text-black w-full max-w-[220px]">
                                        {t.attend}
                                    </button>
                                )}
                                <div className="flex flex-col gap-6 w-full items-center my-auto">
                                    <div className="flex flex-col items-center gap-1">
                                        <span className="text-neutral-500 text-sm">{t.curAttendStreak}</span>
                                        <span className="text-white font-bold text-4xl">{attendStreak.current}<span className="text-sm font-normal ml-1 text-neutral-400">{t.days}</span></span>
                                    </div>
                                    <div className="flex flex-col items-center gap-1">
                                        <span className="text-neutral-500 text-sm">{t.maxAttendStreak}</span>
                                        <span className="text-white font-bold text-4xl">{attendStreak.max}<span className="text-sm font-normal ml-1 text-neutral-400">{t.days}</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </motion.div>
                );
            };

            const renderStats = () => {
                const hierarchy = {};
                sessions.forEach(session => {
                    const d = new Date(session.timestamp);
                    const year = d.getFullYear();
                    const monthIdx = d.getMonth();
                    const monthName = d.toLocaleDateString(t.locale, { month: 'long' });
                    const dWeek = d.getDay();
                    const mDiff = d.getDate() - dWeek + (dWeek === 0 ? -6 : 1);
                    const wStart = new Date(d);
                    wStart.setDate(mDiff);
                    wStart.setHours(0,0,0,0);
                    const wEnd = new Date(wStart);
                    wEnd.setDate(wStart.getDate() + 6);
                    const isSameMonth = wStart.getMonth() === wEnd.getMonth();
                    const startMonthName = wStart.toLocaleDateString(t.locale, { month: 'long' });
                    const endMonthName = wEnd.toLocaleDateString(t.locale, { month: 'long' });
                    
                    const weekKey = isSameMonth 
                        ? `${wStart.getDate()} ~ ${wEnd.getDate()}`
                        : (lang === 'ES'
                            ? `${wStart.toLocaleDateString(t.locale, { month: 'long', day: 'numeric' })} ~ ${wEnd.toLocaleDateString(t.locale, { month: 'long', day: 'numeric' })}`
                            : `${startMonthName} ${wStart.getDate()} ~ ${endMonthName} ${wEnd.getDate()}`
                          );

                    const weekIdx = wStart.getTime(); 
                    const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

                    if (!hierarchy[year]) hierarchy[year] = { total: 0, months: {} };
                    hierarchy[year].total += session.duration;

                    if (!hierarchy[year].months[monthIdx]) hierarchy[year].months[monthIdx] = { name: monthName, total: 0, weeks: {} };
                    hierarchy[year].months[monthIdx].total += session.duration;

                    if (!hierarchy[year].months[monthIdx].weeks[weekIdx]) hierarchy[year].months[monthIdx].weeks[weekIdx] = { key: weekKey, isSameMonth, startMonthName, wStart, wEnd, total: 0, days: {} };
                    hierarchy[year].months[monthIdx].weeks[weekIdx].total += session.duration;

                    if (!hierarchy[year].months[monthIdx].weeks[weekIdx].days[dateKey]) hierarchy[year].months[monthIdx].weeks[weekIdx].days[dateKey] = [];
                    hierarchy[year].months[monthIdx].weeks[weekIdx].days[dateKey].push(session);
                });

                const sortedYears = Object.keys(hierarchy).sort((a, b) => b - a);

                return (
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.3 }} className="w-full h-full flex items-center justify-center pb-10 px-4 pt-4 sm:pt-0">
                        <div className="flex flex-row gap-6 items-center justify-center w-full max-w-[1200px]">
                            <div className="w-[280px] shrink-0 bg-[#141414] h-[620px] p-8 rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col">
                                <div className="text-2xl font-bold tracking-wide text-white mb-10 px-2">{t.statsSummary}</div>
                                <div className="flex flex-col gap-8 w-full px-2">
                                    {[
                                        { label: t.today, value: summary.todaySum },
                                        { label: t.thisWeek, value: summary.weekSum },
                                        { label: t.thisMonth, value: summary.monthSum },
                                        { label: t.thisYear, value: summary.yearSum },
                                        { label: t.allTime, value: summary.totalSum }
                                    ].map(item => (
                                        <div key={item.label} className="flex justify-between items-end border-b border-neutral-800 pb-2">
                                            <span className="text-neutral-400 font-medium text-base">{item.label}</span>
                                            <span className="text-white font-medium text-lg">{formatDuration(item.value)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="w-full max-w-[550px] shrink-0 bg-[#141414] h-[620px] p-4 sm:p-10 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col">
                                <div className="text-lg sm:text-3xl font-medium tracking-wide text-white mb-3 sm:mb-6 px-2">{t.stats}</div>

                                <div className="flex-1 overflow-y-auto pr-2 space-y-6 sm:space-y-8" style={{ scrollbarWidth: 'none' }}>
                                    {sortedYears.length === 0 ? (
                                        <div className="h-full flex items-center justify-center text-neutral-600 pb-10">{t.noRecords}</div>
                                    ) : (
                                        sortedYears.map(year => {
                                            const yearData = hierarchy[year];
                                            const sortedMonths = Object.keys(yearData.months).sort((a, b) => b - a);

                                            return (
                                                <div key={year} className="flex flex-col gap-4">
                                                    <div className="flex items-center justify-between border-b border-neutral-700 pb-1 px-1">
                                                        <div className="text-neutral-300 font-bold text-base sm:text-xl">
                                                            {t.formatYear(year)}
                                                        </div>
                                                        <span className="text-white font-medium text-sm sm:text-lg">{t.totalPrefix}{formatDuration(yearData.total)}</span>
                                                    </div>

                                                    {sortedMonths.map(monthIdx => {
                                                        const monthData = yearData.months[monthIdx];
                                                        const month = monthData.name;
                                                        const sortedWeeks = Object.keys(monthData.weeks).sort((a, b) => b - a);

                                                        return (
                                                            <div key={monthIdx} className="flex flex-col gap-3 pl-2 sm:pl-4 border-l border-neutral-800">
                                                                <div className="flex items-center justify-between px-1">
                                                                    <div className="text-neutral-400 font-semibold text-sm sm:text-lg">
                                                                        {t.formatYearMonth(year, month)}
                                                                    </div>
                                                                    <span className="text-neutral-200 font-medium text-xs sm:text-base">{t.totalPrefix}{formatDuration(monthData.total)}</span>
                                                                </div>

                                                                {sortedWeeks.map(weekIdx => {
                                                                    const weekData = monthData.weeks[weekIdx];
                                                                    const weekKey = weekData.key;
                                                                    const sortedDays = Object.keys(weekData.days).sort((a, b) => new Date(b) - new Date(a));
                                                                    const weekTitle = weekData.isSameMonth ? `${month} ${weekKey}` : weekKey;

                                                                    return (
                                                                        <div key={weekIdx} className="flex flex-col gap-3 pl-2 sm:pl-4 border-l border-neutral-800/80">
                                                                            <div className="flex items-center justify-between px-1">
                                                                                <div className="text-neutral-500 font-medium text-xs sm:text-sm tracking-wide">
                                                                                    {weekTitle}
                                                                                </div>
                                                                                <span className="text-neutral-300 font-medium text-xs sm:text-sm">{t.totalPrefix}{formatDuration(weekData.total)}</span>
                                                                            </div>

                                                                            {sortedDays.map(dateStr => {
                                                                                const daySessions = weekData.days[dateStr];
                                                                                const dayTotal = daySessions.reduce((sum, s) => sum + s.duration, 0);
                                                                                const dateObj = new Date(daySessions[0].timestamp);
                                                                                const mName = dateObj.toLocaleDateString(t.locale, { month: 'long' });
                                                                                const dNum = dateObj.getDate();
                                                                                const baseDate = t.formatMonthDay(mName, dNum);
                                                                                const weekdayStr = dateObj.toLocaleDateString(t.locale, { weekday: 'short' });
                                                                                const dateTitle = `${baseDate} (${weekdayStr})`;

                                                                                return (
                                                                                    <div key={dateStr} className="flex flex-col gap-2 pl-2 sm:pl-4">
                                                                                        <div className="flex items-end justify-between border-b border-neutral-800 pb-1.5 px-1">
                                                                                            <span className="text-neutral-400 font-medium text-xs sm:text-base">{dateTitle}</span>
                                                                                            <span className="text-white font-medium text-xs sm:text-base">{formatDuration(dayTotal)}</span>
                                                                                        </div>
                                                                                        <div className="flex flex-col gap-1.5">
                                                                                            {daySessions.map((session, idx) => (
                                                                                                <div key={idx} className="flex items-center justify-between bg-[#1f1f1f] px-3.5 py-2.5 sm:px-5 sm:py-4 rounded-2xl border border-neutral-800/80 hover:border-neutral-700 transition-colors">
                                                                                                    <div className="flex items-center gap-2.5">
                                                                                                        {(!session.type || session.type === 'timer') ? (
                                                                                                            <div className="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full shrink-0" style={{ backgroundColor: selectedColor }}></div>
                                                                                                        ) : (
                                                                                                            <svg className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-neutral-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                                                                        )}
                                                                                                        <span className="text-neutral-300 font-medium text-xs sm:text-base tracking-wide">{formatTime(session.timestamp)}</span>
                                                                                                    </div>
                                                                                                    <span className="text-neutral-100 font-medium text-xs sm:text-base">{formatDuration(session.duration)}</span>
                                                                                                </div>
                                                                                            ))}
                                                                                        </div>
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                            
                            <div className="w-[280px] shrink-0 bg-[#141414] h-[620px] p-8 rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col items-center justify-center">
                                <div className="flex flex-col items-center gap-12 w-full">
                                    <div className="flex flex-col items-center gap-2">
                                        <span className="text-neutral-400 font-medium text-base">🔥 {t.curFocusStreak}</span>
                                        <span className="text-white font-bold text-6xl">{focusStreak.current}<span className="text-lg font-normal ml-1 text-neutral-400">{t.days}</span></span>
                                    </div>
                                    <div className="flex flex-col items-center gap-2">
                                        <span className="text-neutral-400 font-medium text-base">🏆 {t.maxFocusStreak}</span>
                                        <span className="text-white font-bold text-6xl">{focusStreak.max}<span className="text-lg font-normal ml-1 text-neutral-400">{t.days}</span></span>
                                    </div>
                                    <div className="w-full text-center">
                                        {hasFocusedToday ? (
                                            <div className="px-4 py-3 bg-neutral-800/80 rounded-xl text-white font-medium text-sm">
                                                {t.focusCompletedToday}
                                            </div>
                                        ) : (
                                            <div className="px-4 py-3 bg-neutral-800/40 rounded-xl text-neutral-500 text-sm">
                                                {t.noFocusToday}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </motion.div>
                );
            };

            const renderGroup = () => {
                if (activeGroupId) {
                    const group = groups.find(g => g.id === activeGroupId);
                    const groupSessions = sessions.filter(s => s.groupId === activeGroupId).sort((a,b) => b.timestamp - a.timestamp);
                    const totalDuration = groupSessions.reduce((sum, s) => sum + s.duration, 0);
                    
                    return (
                        <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.3 }} className="w-full h-full flex items-center justify-center pb-10 px-4 pt-4 sm:pt-0">
                            <div className="w-full max-w-[600px] shrink-0 bg-[#141414] h-[620px] p-6 sm:p-10 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col">
                                <div className="flex items-center justify-between mb-6">
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setActiveGroupId(null)} className="text-neutral-500 hover:text-white text-2xl p-2">&larr;</button>
                                        <div className="text-2xl sm:text-3xl font-bold text-white max-w-[200px] truncate">{group?.name}</div>
                                        <div className="flex gap-1 ml-1">
                                            <button onClick={() => { setGroupModal({ isOpen: true, mode: 'edit', id: group.id }); setNewGroupName(group.name); }} className="text-neutral-500 hover:text-white p-1.5 transition-colors">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                            </button>
                                            <button onClick={() => handleDeleteGroup(group.id)} className="text-neutral-500 hover:text-red-400 p-1.5 transition-colors">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="text-white font-medium text-lg sm:text-xl shrink-0">
                                        {formatDetailedTotal(totalDuration)}
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-3" style={{ scrollbarWidth: 'none' }}>
                                    {groupSessions.length === 0 ? (
                                        <div className="text-neutral-500 text-center mt-10 h-full flex items-center justify-center">{t.noRecords}</div>
                                    ) : (
                                        groupSessions.map(session => (
                                            <div key={session.timestamp} className="flex items-center justify-between bg-[#1f1f1f] px-5 py-4 rounded-2xl border border-neutral-800/80">
                                                <div className="flex flex-col gap-1.5">
                                                    <span className="text-white font-medium">{new Date(session.timestamp).toLocaleDateString(t.locale, { month: 'short', day: 'numeric', weekday: 'short' })}</span>
                                                    <div className="flex items-center gap-2 pl-2">
                                                        {(!session.type || session.type === 'timer') ? (
                                                            <div className="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full shrink-0" style={{ backgroundColor: selectedColor }}></div>
                                                        ) : (
                                                            <svg className="w-3 h-3 sm:w-3.5 sm:h-3.5 text-neutral-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                        )}
                                                        <span className="text-neutral-400 text-sm">{formatTime(session.timestamp)}</span>
                                                    </div>
                                                </div>
                                                <span className="text-white font-bold text-lg">{formatDuration(session.duration)}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </motion.div>
                    );
                }

                return (
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.3 }} className="w-full h-full flex items-center justify-center pb-10 px-4 pt-4 sm:pt-0">
                        <div className="w-full max-w-[600px] shrink-0 bg-[#141414] h-[620px] p-6 sm:p-10 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col">
                            <div className="flex items-center justify-between mb-8">
                                <div className="text-2xl sm:text-3xl font-bold text-white">{t.group}</div>
                                {groups.length < 10 && (
                                    <button onClick={() => { setGroupModal({ isOpen: true, mode: 'add', id: null }); setNewGroupName(''); }} className="bg-white text-black px-4 py-2 rounded-full font-bold text-sm hover:bg-neutral-200 transition-colors">
                                        + {t.addGroup}
                                    </button>
                                )}
                            </div>
                            {groups.length === 0 ? (
                                <div className="text-neutral-500 text-center mt-10 h-full flex items-center justify-center">{t.noGroups}</div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto" style={{ scrollbarWidth: 'none' }}>
                                    {groups.map(g => {
                                        const groupSessions = sessions.filter(s => s.groupId === g.id);
                                        const count = groupSessions.length;
                                        const totalDuration = groupSessions.reduce((sum, s) => sum + s.duration, 0);
                                        return (
                                            <button key={g.id} onClick={() => setActiveGroupId(g.id)} className="bg-[#1f1f1f] border border-neutral-800 hover:border-neutral-600 rounded-2xl p-6 flex justify-between items-center transition-colors text-left">
                                                <div className="flex flex-col items-start gap-2 overflow-hidden">
                                                    <span className="text-white font-bold text-lg truncate w-full">{g.name}</span>
                                                    <span className="text-neutral-500 text-sm">{count} {t.sessions}</span>
                                                </div>
                                                <div className="text-white font-medium text-base sm:text-lg shrink-0 ml-2">
                                                    {formatDuration(totalDuration)}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                            {groups.length >= 10 && (
                                <div className="text-neutral-500 text-sm text-center mt-4">{t.maxGroupsMsg}</div>
                            )}
                        </div>
                    </motion.div>
                );
            };

            return (
                <div className="w-screen h-screen flex flex-col sm:flex-row relative overflow-hidden">
                    {/* 그룹 추가 및 편집 모달 */}
                    <AnimatePresence>
                        {groupModal.isOpen && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} className="bg-[#141414] border border-neutral-800 p-6 sm:p-10 rounded-3xl shadow-2xl max-w-sm w-full flex flex-col gap-6">
                                    <div className="text-white text-lg font-bold text-center">{groupModal.mode === 'add' ? t.addGroup : t.editGroup}</div>
                                    <input type="text" value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder={t.groupName} className="bg-[#2a2a2a] text-white px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-white transition-all" maxLength={20} />
                                    <div className="flex gap-3">
                                        <button onClick={() => { setGroupModal({ isOpen: false, mode: 'add', id: null }); setNewGroupName(''); }} className="flex-1 bg-transparent border border-neutral-600 text-neutral-400 py-3 rounded-xl hover:text-white transition-colors">{t.cancel}</button>
                                        <button onClick={() => {
                                            if (newGroupName.trim()) {
                                                if (groupModal.mode === 'add' && groups.length < 10) {
                                                    setGroups([...groups, { id: Date.now(), name: newGroupName.trim() }]);
                                                } else if (groupModal.mode === 'edit') {
                                                    setGroups(groups.map(g => g.id === groupModal.id ? { ...g, name: newGroupName.trim() } : g));
                                                }
                                                setGroupModal({ isOpen: false, mode: 'add', id: null });
                                                setNewGroupName('');
                                            }
                                        }} className="flex-1 bg-white text-black font-bold py-3 rounded-xl disabled:opacity-50 transition-colors" disabled={!newGroupName.trim()}>{t.save}</button>
                                    </div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* 방금 끝난 타이머/스톱워치 그룹 지정 모달 */}
                    <AnimatePresence>
                        {showGroupSelectModal && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} className="bg-[#141414] border border-neutral-800 p-6 sm:p-10 rounded-3xl shadow-2xl max-w-sm w-full flex flex-col gap-6">
                                    <div className="text-white text-lg font-bold text-center px-4 leading-snug">{t.selectGroup}</div>
                                    <div className="flex flex-col gap-3 max-h-60 overflow-y-auto" style={{ scrollbarWidth: 'none' }}>
                                        {groups.map(g => (
                                            <button key={g.id} onClick={() => assignGroupToSession(g.id)} className="bg-[#2a2a2a] hover:bg-white hover:text-black text-white font-bold py-3.5 rounded-xl transition-all border border-transparent hover:border-white">
                                                {g.name}
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => setShowGroupSelectModal(false)} className="text-neutral-500 hover:text-white text-sm mt-2 transition-colors">{t.skip}</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {!(mode === 'timer' && eggIsRunning) && !(mode === 'stopwatch' && swIsRunning) && (
                            <motion.div initial={{ x: -100, opacity: 0 }} animate={{ x: 0, opacity: 1 }} exit={{ x: -100, opacity: 0 }} transition={{ duration: 0.2 }} className="w-full sm:w-24 sm:h-full bg-[#141414] border-b sm:border-b-0 sm:border-r border-[#2a2a2a] flex sm:flex-col items-center justify-between sm:justify-start px-4 sm:px-0 py-2.5 sm:py-8 z-25 shrink-0">
                                <div className="flex sm:flex-col items-center gap-1.5 sm:gap-3">
                                    <span className="hidden sm:inline text-xs text-neutral-500 font-bold">{t.lang}</span>
                                    <button onClick={() => setLang('KO')} className={`text-[11px] sm:text-sm font-bold w-7 h-7 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors ${lang === 'KO' ? 'bg-white text-black' : 'text-neutral-400 hover:bg-neutral-800'}`}>KO</button>
                                    <button onClick={() => setLang('EN')} className={`text-[11px] sm:text-sm font-bold w-7 h-7 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors ${lang === 'EN' ? 'bg-white text-black' : 'text-neutral-400 hover:bg-neutral-800'}`}>EN</button>
                                    <button onClick={() => setLang('ES')} className={`text-[11px] sm:text-sm font-bold w-7 h-7 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors ${lang === 'ES' ? 'bg-white text-black' : 'text-neutral-400 hover:bg-neutral-800'}`}>ES</button>
                                </div>
                                <div className="flex sm:flex-col items-center gap-1.5 sm:gap-3 sm:flex-1 sm:overflow-y-auto sm:w-full sm:mt-6">
                                    <span className="hidden sm:inline text-xs text-neutral-500 font-bold">{t.color}</span>
                                    {themeColors.map(color => (
                                        <button key={color.id} onClick={() => setSelectedColor(color.value)} className={`w-5 h-5 sm:w-8 sm:h-8 rounded-full transition-all duration-200 shrink-0 ${selectedColor === color.value ? 'ring-2 ring-white ring-offset-2 sm:ring-offset-4 ring-offset-[#141414] scale-110' : 'hover:scale-110 opacity-70 hover:opacity-100'}`} style={{ backgroundColor: color.value }} />
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    <div className="flex-1 flex flex-col h-full relative overflow-hidden">
                        <AnimatePresence>
                            {!(mode === 'timer' && eggIsRunning) && !(mode === 'stopwatch' && swIsRunning) && (
                                <motion.div initial={{ y: -50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: -50, opacity: 0 }} transition={{ duration: 0.2 }} className="absolute top-16 sm:top-8 left-0 right-0 flex flex-wrap justify-center gap-2 sm:gap-8 z-10 text-[11px] sm:text-lg font-medium px-2">
                                    <button onClick={() => setMode('calendar')} className={`px-1.5 sm:px-4 py-1 transition-colors whitespace-nowrap ${mode === 'calendar' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.calendar}</button>
                                    <button onClick={() => setMode('clock')} className={`px-1.5 sm:px-4 py-1 transition-colors whitespace-nowrap ${mode === 'clock' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.clock}</button>
                                    <button onClick={() => setMode('timer')} className={`px-1.5 sm:px-4 py-1 transition-colors whitespace-nowrap ${mode === 'timer' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.timer}</button>
                                    <button onClick={() => setMode('stopwatch')} className={`px-1.5 sm:px-4 py-1 transition-colors whitespace-nowrap ${mode === 'stopwatch' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.sw}</button>
                                    <button onClick={() => setMode('stats')} className={`px-1.5 sm:px-4 py-1 transition-colors whitespace-nowrap ${mode === 'stats' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.stats}</button>
                                    <button onClick={() => setMode('group')} className={`px-1.5 sm:px-4 py-1 transition-colors whitespace-nowrap ${mode === 'group' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.group}</button>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {mode === 'stats' && renderStats()}
                        {mode === 'group' && renderGroup()}
                        {mode === 'calendar' && renderCalendar()}
                        {mode === 'clock' && renderClock()}

                        {mode === 'timer' && (
                            <motion.div className="flex-1 flex flex-col items-center justify-center w-full h-full px-4 pt-10 sm:pt-0"
                                initial={{ scale: 1, opacity: eggIsAlarming ? 0.5 : 1 }}
                                animate={{ 
                                    scale: eggIsRunning ? 1.25 : 1, 
                                    opacity: eggIsAlarming ? 0.5 : 1, 
                                    x: eggIsAlarming ? [-10, 10, -10, 10, 0] : 0 
                                }}
                                transition={{ 
                                    scale: { duration: 0.3, ease: "easeInOut" }
                                }}
                                style={{ transformOrigin: "center center" }}
                            >
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-20">
                                    <div ref={eggRef} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp} className={`egg-shape w-44 h-60 sm:w-72 sm:h-96 bg-[#2a2a2a] shadow-2xl flex-shrink-0 ${!eggIsRunning ? 'cursor-ns-resize' : 'cursor-default'}`}>
                                        <div className={`absolute bottom-0 w-full ${isDragging ? '' : 'fill-transition'}`} style={{ height: `${getFillPercentage()}%`, backgroundColor: selectedColor }}></div>
                                    </div>
                                    <div className="text-6xl sm:text-[7rem] font-mono tracking-tighter text-white text-center sm:text-left sm:w-80 flex-shrink-0 leading-none">
                                        {getEggDisplayTime()}
                                    </div>
                                </div>
                                {!eggIsRunning && !eggIsAlarming && (
                                    <div className="text-neutral-500 text-sm sm:text-base mt-3 sm:mt-10">
                                        {now.toLocaleDateString(t.locale, { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
                                    </div>
                                )}
                            </motion.div>
                        )}

                        {mode === 'stopwatch' && (
                            <motion.div className="flex-1 flex items-center justify-center w-full h-full px-4" 
                                initial={{ scale: 1 }} 
                                animate={{ scale: swIsRunning ? 1.25 : 1 }} 
                                transition={{ 
                                    scale: { duration: 0.3, ease: "easeInOut" }
                                }}
                                style={{ transformOrigin: "center center" }}
                            >
                                <div className="text-6xl sm:text-[9rem] font-mono tracking-tighter text-white leading-none text-center">
                                    {getSwDisplayTime()}
                                </div>
                            </motion.div>
                        )}

                        {mode === 'timer' && (
                            <div className="absolute right-4 bottom-4 sm:right-12 sm:bottom-12 flex flex-col items-end gap-2.5 sm:gap-6 z-10">
                                <AnimatePresence>
                                    {!eggIsRunning && (eggDuration !== 1800000 || eggElapsed > 0) && !eggIsAlarming && (
                                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                            <button onClick={handleEggReset} className="text-neutral-400 hover:text-white underline underline-offset-4 text-xs sm:text-sm font-medium">{t.reset}</button>
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                                {!eggIsAlarming ? (
                                    <button onClick={toggleEggRun} className={`px-5 py-2 sm:px-8 sm:py-4 rounded-full font-bold text-xs sm:text-lg border-2 transition-all duration-300 ${eggIsRunning ? 'bg-transparent border-neutral-500 text-neutral-300 hover:text-white hover:border-white' : 'bg-transparent border-white text-white hover:bg-white hover:text-black'}`}>
                                        {eggIsRunning ? t.pause : t.start}
                                    </button>
                                ) : (
                                    <button onClick={() => { handleEggReset(); if (groups.length > 0) setShowGroupSelectModal(true); }} className="px-6 py-3 sm:px-10 sm:py-5 bg-red-500 text-white font-bold text-sm sm:text-xl rounded-full animate-pulse shadow-[0_0_40px_rgba(239,68,68,0.8)]">{t.stopAlarm}</button>
                                )}
                            </div>
                        )}

                        {mode === 'stopwatch' && (
                            <div className="absolute right-4 bottom-4 sm:right-12 sm:bottom-12 flex flex-col items-end gap-2.5 sm:gap-6 z-10">
                                <AnimatePresence>
                                    {!swIsRunning && swElapsed > 0 && (
                                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="flex items-center gap-4">
                                            <button onClick={handleSwReset} className="text-neutral-400 hover:text-white underline underline-offset-4 text-xs sm:text-sm font-medium">{t.reset}</button>
                                            <button onClick={handleSwComplete} className="text-blue-400 hover:text-blue-300 underline underline-offset-4 text-xs sm:text-sm font-medium">{t.complete}</button>
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                                <button onClick={toggleSwRun} className={`px-5 py-2 sm:px-8 sm:py-4 rounded-full font-bold text-xs sm:text-lg border-2 transition-all duration-300 ${swIsRunning ? 'bg-transparent border-neutral-500 text-neutral-300 hover:text-white hover:border-white' : 'bg-transparent border-white text-white hover:bg-white hover:text-black'}`}>
                                    {swIsRunning ? t.pause : t.start}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
