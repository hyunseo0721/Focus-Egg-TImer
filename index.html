<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Egg Timer</title>
    
    <!-- React & DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { 
            margin: 0; background-color: #1f1f1f; color: white; overflow: hidden; user-select: none; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        .egg-shape { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; overflow: hidden; position: relative; touch-action: none; }
        .fill-transition { transition: height 0.05s linear; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const themeColors = [
            { id: 'blue', value: '#3b82f6' }, { id: 'red', value: '#ef4444' }, { id: 'pink', value: '#ec4899' },
            { id: 'yellow', value: '#eab308' }, { id: 'green', value: '#22c55e' }, { id: 'purple', value: '#a855f7' },
            { id: 'white', value: '#ffffff' }, { id: 'black', value: '#2a2a2a' } 
        ];

        const i18n = {
            KO: { 
                lang: "언어", color: "색상", start: "집중 시작하기", pause: "일시정지", reset: "초기화", stopAlarm: "알람 끄기", clock: "시계", timer: "에그 타이머", sw: "스톱워치", calendar: "달력", stats: "통계",
                locale: "ko-KR", am: "오전", pm: "오후", noRecords: "기록이 없습니다.", h: "시간", m: "분", s: "초"
            },
            EN: { 
                lang: "Lang", color: "Color", start: "Start Focus", pause: "Pause", reset: "Reset", stopAlarm: "Stop", clock: "Clock", timer: "Egg Timer", sw: "Stopwatch", calendar: "Calendar", stats: "Stats",
                locale: "en-US", am: "AM", pm: "PM", noRecords: "No records found.", h: "h", m: "m", s: "s"
            },
            ES: { 
                lang: "Idioma", color: "Color", start: "Iniciar Enfoque", pause: "Pausa", reset: "Restablecer", stopAlarm: "Detener", clock: "Reloj", timer: "Temporizador Huevo", sw: "Cronómetro", calendar: "Calendario", stats: "Estadísticas",
                locale: "es-ES", am: "AM", pm: "PM", noRecords: "No hay registros.", h: "h", m: "m", s: "s"
            }
        };

        function App() {
            const [lang, setLang] = useState('KO');
            const [mode, setMode] = useState('timer'); 
            const [selectedColor, setSelectedColor] = useState('#3b82f6'); 
            const [now, setNow] = useState(new Date());
            
            // --- 달력 상태 ---
            const [calYear, setCalYear] = useState(new Date().getFullYear());
            const [calMonth, setCalMonth] = useState(new Date().getMonth()); 

            // --- 통계 및 기록 상태 ---
            const [sessions, setSessions] = useState(() => {
                try {
                    const saved = localStorage.getItem('focus_egg_sessions_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            useEffect(() => {
                try {
                    localStorage.setItem('focus_egg_sessions_v2', JSON.stringify(sessions));
                } catch (e) {
                    console.log("Storage save error:", e);
                }
            }, [sessions]);
            
            // --- 에그 타이머 상태 ---
            const [eggIsRunning, setEggIsRunning] = useState(false);
            const [eggIsAlarming, setEggIsAlarming] = useState(false);
            const [eggDuration, setEggDuration] = useState(1800000); 
            const [eggElapsed, setEggElapsed] = useState(0); 
            
            // --- 스톱워치 상태 ---
            const [swIsRunning, setSwIsRunning] = useState(false);
            const [swElapsed, setSwElapsed] = useState(0);
            
            const [isDragging, setIsDragging] = useState(false);
            const eggRef = useRef(null);

            const eggStartRef = useRef(0);
            const eggAccRef = useRef(0);
            const eggDurationRef = useRef(1800000);
            const eggIsRunningRef = useRef(false);

            const swStartRef = useRef(0);
            const swAccRef = useRef(0);
            const swIsRunningRef = useRef(false);

            const requestRef = useRef(null);
            const audioRef = useRef(null);
            const t = i18n[lang];

            useEffect(() => { eggIsRunningRef.current = eggIsRunning; }, [eggIsRunning]);
            useEffect(() => { eggDurationRef.current = eggDuration; }, [eggDuration]);
            useEffect(() => { swIsRunningRef.current = swIsRunning; }, [swIsRunning]);

            useEffect(() => {
                if (!audioRef.current) {
                    audioRef.current = new Audio('soundeffect/alarm.wav');
                    audioRef.current.loop = true;
                    audioRef.current.volume = 1.0; 
                }
            }, []);

            useEffect(() => {
                const workerCode = `
                    let timer;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            timer = setInterval(() => self.postMessage('tick'), 1000);
                        } else if (e.data === 'stop') {
                            clearInterval(timer);
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));

                worker.onmessage = () => {
                    setNow(new Date());
                    
                    if (eggIsRunningRef.current) {
                        const elapsed = eggAccRef.current + (Date.now() - eggStartRef.current);
                        if (elapsed >= eggDurationRef.current) {
                            setEggElapsed(eggDurationRef.current);
                            setEggIsRunning(false);
                            eggIsRunningRef.current = false;
                            setEggIsAlarming(true);
                            if (audioRef.current) {
                                audioRef.current.play().catch(err => console.log("Audio Error:", err));
                            }
                            
                            const endTime = Date.now();
                            setSessions(prev => {
                                const newSession = { timestamp: endTime, duration: eggDurationRef.current };
                                const updated = [newSession, ...prev];
                                try {
                                    localStorage.setItem('focus_egg_sessions_v2', JSON.stringify(updated));
                                } catch (e) {}
                                return updated;
                            });
                        }
                    }
                };

                worker.postMessage('start');
                return () => { worker.postMessage('stop'); worker.terminate(); };
            }, []);

            useEffect(() => {
                const updateUI = () => {
                    const currentTime = Date.now();
                    if (eggIsRunningRef.current) {
                        const elapsed = eggAccRef.current + (currentTime - eggStartRef.current);
                        if (elapsed < eggDurationRef.current) setEggElapsed(elapsed);
                    }
                    if (swIsRunningRef.current) {
                        setSwElapsed(swAccRef.current + (currentTime - swStartRef.current));
                    }
                    requestRef.current = requestAnimationFrame(updateUI);
                };
                requestRef.current = requestAnimationFrame(updateUI);
                return () => cancelAnimationFrame(requestRef.current);
            }, []);

            const toggleEggRun = () => {
                if (eggDuration === 0) return;
                if (!eggIsRunning) eggStartRef.current = Date.now();
                else eggAccRef.current = eggElapsed;
                setEggIsRunning(!eggIsRunning);
            };

            const handleEggReset = () => {
                setEggIsRunning(false); setEggIsAlarming(false); setEggElapsed(0); eggAccRef.current = 0;
                if (audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; }
            };

            const toggleSwRun = () => {
                if (!swIsRunning) swStartRef.current = Date.now();
                else swAccRef.current = swElapsed;
                setSwIsRunning(!swIsRunning);
            };

            const handleSwReset = () => { setSwIsRunning(false); setSwElapsed(0); swAccRef.current = 0; };

            const handlePointerDown = (e) => { if (eggIsRunning) return; setIsDragging(true); e.target.setPointerCapture(e.pointerId); updateTimeFromPointer(e); };
            const handlePointerMove = (e) => { if (!isDragging || eggIsRunning) return; updateTimeFromPointer(e); };
            const handlePointerUp = (e) => { setIsDragging(false); e.target.releasePointerCapture(e.pointerId); };
            const updateTimeFromPointer = (e) => {
                if (!eggRef.current) return;
                const rect = eggRef.current.getBoundingClientRect();
                let y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
                let percent = 1 - (y / rect.height);
                let totalSeconds = Math.round((percent * 3600) / 10) * 10;
                setEggDuration(totalSeconds * 1000);
                setEggElapsed(0); eggAccRef.current = 0;
            };

            const getEggDisplayTime = () => {
                const msToDisplay = Math.max(0, eggDuration - eggElapsed);
                const m = Math.floor(msToDisplay / 60000), s = Math.floor((msToDisplay % 60000) / 1000);
                return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            };

            const getSwDisplayTime = () => {
                const totalSec = Math.floor(swElapsed / 1000);
                const m = Math.floor(totalSec / 60), s = totalSec % 60, ms = swElapsed % 1000;
                return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
            };

            const getFillPercentage = () => (eggDuration === 0) ? 0 : (Math.max(0, eggDuration - eggElapsed) / 3600000) * 100;

            const renderClock = () => {
                const hours = now.getHours();
                const ampm = hours >= 12 ? t.pm : t.am;
                const h12 = hours % 12 || 12;
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                const dateStr = now.toLocaleDateString(t.locale, { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

                return (
                    <motion.div initial={{ opacity: 0, scale: 1 }} animate={{ opacity: 1, scale: 1 }} className="flex flex-col items-center justify-center w-full h-full pb-10 px-4 text-center">
                        <div className="text-neutral-400 text-xl sm:text-3xl font-medium tracking-widest mb-6 sm:mb-10">{t.clock}</div>
                        <div className="flex flex-col sm:flex-row items-center sm:items-end gap-2 sm:gap-6 text-white mb-6">
                            <span className="text-2xl sm:text-4xl text-neutral-400 sm:mb-4 font-medium">{ampm}</span>
                            <span className="text-5xl sm:text-[10rem] font-mono tracking-tighter leading-none">{String(h12).padStart(2,'0')}:{m}:{s}</span>
                        </div>
                        <div className="text-neutral-500 text-base sm:text-2xl">{dateStr}</div>
                    </motion.div>
                );
            };

            const renderCalendar = () => {
                const firstDayIndex = new Date(calYear, calMonth, 1).getDay();
                const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
                const prevTotalDays = new Date(calYear, calMonth, 0).getDate();

                const days = [];
                const weekdays = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(2021, 5, 6 + i); 
                    weekdays.push(d.toLocaleDateString(t.locale, { weekday: 'short' }));
                }

                for (let i = firstDayIndex - 1; i >= 0; i--) days.push({ day: prevTotalDays - i, currentMonth: false });
                for (let i = 1; i <= totalDays; i++) days.push({ day: i, currentMonth: true });
                const remainingCells = 42 - days.length;
                for (let i = 1; i <= remainingCells; i++) days.push({ day: i, currentMonth: false });

                const today = new Date();
                const isCurrentMonthYear = today.getFullYear() === calYear && today.getMonth() === calMonth;
                const todayDate = today.getDate();

                const months = Array.from({ length: 12 }, (_, i) => {
                    return new Date(2026, i, 1).toLocaleDateString(t.locale, { month: 'long' });
                });

                const prevMonth = () => { if (calMonth === 0) { setCalYear(calYear - 1); setCalMonth(11); } else { setCalMonth(calMonth - 1); } };
                const nextMonth = () => { if (calMonth === 11) { setCalYear(calYear + 1); setCalMonth(0); } else { setCalMonth(calMonth + 1); } };

                return (
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.3 }} className="flex flex-col items-center justify-center w-full h-full pb-10 px-4">
                        <div className="w-full max-w-[550px] bg-[#141414] p-5 sm:p-12 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl border border-neutral-800/50">
                            <div className="flex justify-between items-center mb-4 sm:mb-10 px-2">
                                <button onClick={prevMonth} className="text-xl sm:text-3xl text-neutral-500 hover:text-white transition-colors p-2">&larr;</button>
                                <div className="text-xl sm:text-4xl font-medium tracking-wide text-white">
                                    {months[calMonth]} <span className="font-light text-neutral-400 ml-1">{calYear}</span>
                                </div>
                                <button onClick={nextMonth} className="text-xl sm:text-3xl text-neutral-500 hover:text-white transition-colors p-2">&rarr;</button>
                            </div>

                            <div className="grid grid-cols-7 mb-3 sm:mb-6">
                                {weekdays.map((w, idx) => (
                                    <div key={idx} className={`text-center text-xs sm:text-sm font-semibold tracking-widest uppercase ${idx === 0 ? 'text-red-400/50' : idx === 6 ? 'text-blue-400/50' : 'text-neutral-500'}`}>
                                        {w}
                                    </div>
                                ))}
                            </div>

                            <div className="grid grid-cols-7 gap-y-1.5 sm:gap-y-4 gap-x-1 sm:gap-x-2">
                                {days.map((item, idx) => {
                                    const isToday = isCurrentMonthYear && item.currentMonth && item.day === todayDate;
                                    return (
                                        <div key={idx} className="flex justify-center items-center">
                                            <div 
                                                className={`w-8 h-8 sm:w-12 sm:h-12 flex items-center justify-center rounded-full text-sm sm:text-xl transition-all duration-200 ${
                                                    !item.currentMonth ? 'text-neutral-700 font-light' : 
                                                    isToday ? 'bg-white text-black font-bold scale-110' : 
                                                    'text-neutral-200 hover:bg-[#2a2a2a] cursor-pointer'
                                                }`}
                                            >
                                                {item.day}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </motion.div>
                );
            };

            const formatTime = (timestamp) => {
                const d = new Date(timestamp);
                const hours = d.getHours();
                const ampm = hours >= 12 ? t.pm : t.am;
                const h12 = hours % 12 || 12;
                const m = String(d.getMinutes()).padStart(2, '0');
                return `${ampm} ${h12}:${m}`;
            };

            const formatDuration = (ms) => {
                if (!ms) return `0${t.s}`;
                const totalSecs = Math.floor(ms / 1000);
                const h = Math.floor(totalSecs / 3600);
                const m = Math.floor((totalSecs % 3600) / 60);
                const s = totalSecs % 60;
                
                let res = [];
                if (h > 0) res.push(`${h}${t.h}`);
                if (m > 0) res.push(`${m}${t.m}`);
                if (s > 0) res.push(`${s}${t.s}`);
                return res.length > 0 ? res.join(' ') : `0${t.s}`;
            };

            const renderStats = () => {
                const grouped = sessions.reduce((acc, session) => {
                    const d = new Date(session.timestamp);
                    const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    if (!acc[dateKey]) acc[dateKey] = [];
                    acc[dateKey].push(session);
                    return acc;
                }, {});

                const sortedDates = Object.keys(grouped).sort((a,b) => new Date(b) - new Date(a));

                return (
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.3 }} className="flex flex-col items-center justify-center w-full h-full pb-10 px-4">
                        <div className="w-full max-w-[550px] bg-[#141414] p-5 sm:p-10 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl border border-neutral-800/50 flex flex-col h-[440px] sm:h-[550px]">
                            <div className="text-xl sm:text-3xl font-medium tracking-wide text-white mb-4 sm:mb-8 px-2">{t.stats}</div>
                            
                            <div className="flex-1 overflow-y-auto pr-2 space-y-5 sm:space-y-8" style={{ scrollbarWidth: 'none' }}>
                                {sortedDates.length === 0 ? (
                                    <div className="h-full flex items-center justify-center text-neutral-600 pb-10">{t.noRecords}</div>
                                ) : (
                                    sortedDates.map(dateStr => {
                                        const daySessions = grouped[dateStr];
                                        const dayTotal = daySessions.reduce((sum, s) => sum + s.duration, 0);
                                        const dateObj = new Date(daySessions[0].timestamp);
                                        const dateTitle = dateObj.toLocaleDateString(t.locale, { month: 'long', day: 'numeric', weekday: 'short' });

                                        return (
                                            <div key={dateStr} className="flex flex-col gap-2.5">
                                                <div className="flex items-end justify-between border-b border-neutral-800 pb-2 px-1">
                                                    <span className="text-neutral-400 font-medium text-sm sm:text-lg">{dateTitle}</span>
                                                    <span className="text-white font-mono font-bold text-sm sm:text-lg">{formatDuration(dayTotal)}</span>
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    {daySessions.map((session, idx) => (
                                                        <div key={idx} className="flex items-center justify-between bg-[#1f1f1f] px-4 py-3 sm:px-5 sm:py-4 rounded-2xl border border-neutral-800/80 hover:border-neutral-700 transition-colors">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: selectedColor }}></div>
                                                                <span className="text-neutral-300 font-medium text-xs sm:text-base tracking-wide">{formatTime(session.timestamp)}</span>
                                                            </div>
                                                            <span className="text-neutral-100 font-mono font-semibold text-xs sm:text-base">{formatDuration(session.duration)}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </motion.div>
                );
            };

            return (
                <div className="w-screen h-screen flex flex-col sm:flex-row relative overflow-hidden">
                    <AnimatePresence>
                        {!(mode === 'timer' && eggIsRunning) && !(mode === 'stopwatch' && swIsRunning) && (
                            <motion.div initial={{ x: -100, opacity: 0 }} animate={{ x: 0, opacity: 1 }} exit={{ x: -100, opacity: 0 }} transition={{ duration: 0.4 }} className="w-full sm:w-24 sm:h-full bg-[#141414] border-b sm:border-b-0 sm:border-r border-[#2a2a2a] flex sm:flex-col items-center justify-around sm:justify-start py-3 sm:py-8 z-25 shrink-0">
                                <div className="flex sm:flex-col items-center gap-2 sm:gap-3 sm:mb-10">
                                    <span className="hidden sm:inline text-xs text-neutral-500 font-bold">{t.lang}</span>
                                    <button onClick={() => setLang('KO')} className={`text-xs sm:text-sm font-bold w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors ${lang === 'KO' ? 'bg-white text-black' : 'text-neutral-400 hover:bg-neutral-800'}`}>KO</button>
                                    <button onClick={() => setLang('EN')} className={`text-xs sm:text-sm font-bold w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors ${lang === 'EN' ? 'bg-white text-black' : 'text-neutral-400 hover:bg-neutral-800'}`}>EN</button>
                                    <button onClick={() => setLang('ES')} className={`text-xs sm:text-sm font-bold w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors ${lang === 'ES' ? 'bg-white text-black' : 'text-neutral-400 hover:bg-neutral-800'}`}>ES</button>
                                </div>
                                <div className="hidden sm:flex flex-col items-center gap-3 flex-1 overflow-y-auto w-full">
                                    <span className="text-xs text-neutral-500 font-bold">{t.color}</span>
                                    {themeColors.map(color => (
                                        <button key={color.id} onClick={() => setSelectedColor(color.value)} className={`w-8 h-8 rounded-full mb-2 transition-all duration-200 shrink-0 ${selectedColor === color.value ? 'ring-2 ring-white ring-offset-4 ring-offset-[#141414] scale-110' : 'hover:scale-110 opacity-70 hover:opacity-100'}`} style={{ backgroundColor: color.value }} />
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    <div className="flex-1 flex flex-col h-full relative overflow-hidden">
                        <AnimatePresence>
                            {!(mode === 'timer' && eggIsRunning) && !(mode === 'stopwatch' && swIsRunning) && (
                                <motion.div initial={{ y: -50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: -50, opacity: 0 }} className="absolute top-20 sm:top-8 left-0 right-0 flex flex-wrap justify-center gap-3 sm:gap-8 z-10 text-xs sm:text-lg font-medium px-4">
                                    <button onClick={() => setMode('calendar')} className={`px-2 sm:px-4 py-1 transition-colors ${mode === 'calendar' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.calendar}</button>
                                    <button onClick={() => setMode('clock')} className={`px-2 sm:px-4 py-1 transition-colors ${mode === 'clock' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.clock}</button>
                                    <button onClick={() => setMode('timer')} className={`px-2 sm:px-4 py-1 transition-colors ${mode === 'timer' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.timer}</button>
                                    <button onClick={() => setMode('stopwatch')} className={`px-2 sm:px-4 py-1 transition-colors ${mode === 'stopwatch' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.sw}</button>
                                    <button onClick={() => setMode('stats')} className={`px-2 sm:px-4 py-1 transition-colors ${mode === 'stats' ? 'text-white border-b-2 border-white' : 'text-neutral-500 hover:text-neutral-300'}`}>{t.stats}</button>
                                </motion.div>
                            )}
                        </AnimatePresence>

                        {mode === 'stats' && renderStats()}
                        {mode === 'calendar' && renderCalendar()}
                        {mode === 'clock' && renderClock()}

                        {mode === 'timer' && (
                            <motion.div className="flex-1 flex flex-col items-center justify-center w-full h-full px-4 pt-12 sm:pt-0"
                                initial={{ scale: eggIsRunning ? 1.25 : 1, opacity: eggIsAlarming ? 0.5 : 1, x: 0 }}
                                animate={{ scale: eggIsRunning ? 1.25 : 1, opacity: eggIsAlarming ? 0.5 : 1, x: eggIsAlarming ? [-10, 10, -10, 10, 0] : 0 }}
                                transition={{ duration: 0.5, ease: "easeInOut" }}
                            >
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-6 sm:gap-20">
                                    <div ref={eggRef} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp} className={`egg-shape w-40 h-52 sm:w-72 sm:h-96 bg-[#2a2a2a] shadow-2xl flex-shrink-0 ${!eggIsRunning ? 'cursor-ns-resize' : 'cursor-default'}`}>
                                        <div className={`absolute bottom-0 w-full ${isDragging ? '' : 'fill-transition'}`} style={{ height: `${getFillPercentage()}%`, backgroundColor: selectedColor }}></div>
                                    </div>
                                    <div className="text-5xl sm:text-[7rem] font-mono tracking-tighter text-white text-center sm:text-left sm:w-80 flex-shrink-0 leading-none">
                                        {getEggDisplayTime()}
                                    </div>
                                </div>
                                {!eggIsRunning && !eggIsAlarming && (
                                    <div className="text-neutral-500 text-xs sm:text-base mt-4 sm:mt-10">
                                        {now.toLocaleDateString(t.locale, { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
                                    </div>
                                )}
                            </motion.div>
                        )}

                        {mode === 'stopwatch' && (
                            <motion.div className="flex-1 flex items-center justify-center w-full h-full px-4" initial={{ scale: swIsRunning ? 1.25 : 1 }} animate={{ scale: swIsRunning ? 1.25 : 1 }} transition={{ duration: 0.5 }}>
                                <div className="text-5xl sm:text-[9rem] font-mono tracking-tighter text-white leading-none text-center">
                                    {getSwDisplayTime()}
                                </div>
                            </motion.div>
                        )}

                        {mode === 'timer' && (
                            <div className="absolute right-5 bottom-5 sm:right-12 sm:bottom-12 flex flex-col items-end gap-3 sm:gap-6 z-10">
                                <AnimatePresence>
                                    {!eggIsRunning && (eggDuration !== 1800000 || eggElapsed > 0) && !eggIsAlarming && (
                                        <motion.button initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={handleEggReset} className="text-neutral-400 hover:text-white underline underline-offset-4 text-xs sm:text-sm font-medium">{t.reset}</motion.button>
                                    )}
                                </AnimatePresence>
                                {!eggIsAlarming ? (
                                    <button onClick={toggleEggRun} className={`px-5 py-2.5 sm:px-8 sm:py-4 rounded-full font-bold text-sm sm:text-lg border-2 transition-all duration-300 ${eggIsRunning ? 'bg-transparent border-neutral-500 text-neutral-300 hover:text-white hover:border-white' : 'bg-transparent border-white text-white hover:bg-white hover:text-black'}`}>
                                        {eggIsRunning ? t.pause : t.start}
                                    </button>
                                ) : (
                                    <button onClick={handleEggReset} className="px-7 py-3.5 sm:px-10 sm:py-5 bg-red-500 text-white font-bold text-base sm:text-xl rounded-full animate-pulse shadow-[0_0_40px_rgba(239,68,68,0.8)]">{t.stopAlarm}</button>
                                )}
                            </div>
                        )}

                        {mode === 'stopwatch' && (
                            <div className="absolute right-5 bottom-5 sm:right-12 sm:bottom-12 flex flex-col items-end gap-3 sm:gap-6 z-10">
                                <AnimatePresence>
                                    {!swIsRunning && swElapsed > 0 && (
                                        <motion.button initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={handleSwReset} className="text-neutral-400 hover:text-white underline underline-offset-4 text-xs sm:text-sm font-medium">{t.reset}</motion.button>
                                    )}
                                </AnimatePresence>
                                <button onClick={toggleSwRun} className={`px-5 py-2.5 sm:px-8 sm:py-4 rounded-full font-bold text-sm sm:text-lg border-2 transition-all duration-300 ${swIsRunning ? 'bg-transparent border-neutral-500 text-neutral-300 hover:text-white hover:border-white' : 'bg-transparent border-white text-white hover:bg-white hover:text-black'}`}>
                                    {swIsRunning ? t.pause : t.start}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
